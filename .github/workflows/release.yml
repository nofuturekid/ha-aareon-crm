name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match manifest version
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/aareon_crm/manifest.json'))['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
